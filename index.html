<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>506小剧场 · 剧本杀</title>
<style>
  :root{
    --ink:#15110d; --ink2:#1d1813; --ink3:#272019; --line:#3a3026;
    --gold:#d6a85a; --gold2:#b8924a; --blood:#a23a31; --blood2:#c84a3c;
    --paper:#e9dcc3; --paperink:#2c2418; --paperline:#cbb88f;
    --txt:#e8ddca; --dim:#a99a82; --faint:#7c6f5c;
    --serif:'Songti SC','Noto Serif SC',Georgia,'Times New Roman',serif;
    --sans:'PingFang SC','Noto Sans SC',-apple-system,system-ui,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--txt);font-family:var(--sans);}
  body{min-height:100vh;min-height:100dvh;overflow-x:hidden;}
  #app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
  .scr{flex:1;display:flex;flex-direction:column;padding:20px 18px 28px;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes seal{from{transform:scale(.6) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
  h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.04em;}
  .brand{font-family:var(--serif);letter-spacing:.5em;font-size:13px;color:var(--gold);text-align:center;margin-bottom:2px;text-indent:.5em;}
  .title{font-family:var(--serif);font-size:40px;text-align:center;color:var(--txt);letter-spacing:.22em;text-indent:.22em;margin:4px 0 6px;}
  .sub{text-align:center;color:var(--faint);font-size:12.5px;letter-spacing:.08em;margin-bottom:26px;}
  .card{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .row{display:flex;gap:10px;align-items:center;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:13px;
    padding:15px 16px;font-size:16px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:transform .12s,filter .2s,opacity .2s;letter-spacing:.04em;}
  .btn:active{transform:scale(.975)}
  .btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a140c;box-shadow:0 6px 18px -8px var(--gold);}
  .btn-blood{background:linear-gradient(180deg,var(--blood2),var(--blood));color:#fff;box-shadow:0 6px 18px -8px var(--blood);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt);}
  .btn-dark{background:var(--ink3);color:var(--txt);border:1px solid var(--line);}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4);}
  .btn-sm{padding:10px 14px;font-size:13.5px;border-radius:10px;width:auto;}
  input,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:11px;color:var(--txt);
    padding:14px 14px;font-size:16px;font-family:var(--sans);outline:none;}
  input:focus,textarea:focus{border-color:var(--gold2);}
  input::placeholder,textarea::placeholder{color:var(--faint);}
  .lbl{font-size:12px;color:var(--dim);letter-spacing:.12em;margin:0 0 7px 2px;text-transform:uppercase;}
  .hint{font-size:12px;color:var(--faint);line-height:1.6;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);letter-spacing:.05em;}

  /* ---------- 首页明亮风格 ---------- */
  .home-screen{background:linear-gradient(180deg,#faf6f0 0%,#f5efe6 100%);color:#3d3225;}
  .home-screen .brand{color:#c4956a;letter-spacing:.4em;}
  .home-screen .title{color:#4a3f32;font-size:36px;font-weight:700;}
  .home-screen .sub{color:#8a7d6e;font-size:13px;}
  .home-screen .card{background:#fff;border:1px solid #e8dfd3;box-shadow:0 4px 20px -6px rgba(0,0,0,.08);}
  .home-screen input{background:#faf8f5;border-color:#ddd5c8;color:#3d3225;}
  .home-screen input::placeholder{color:#b0a898;}
  .home-screen .btn-gold{background:linear-gradient(180deg,#e8c088,#d4a76a);color:#fff;box-shadow:0 6px 18px -8px rgba(212,167,106,.5);}
  .home-screen .btn-ghost{border-color:#d5cdc0;color:#6b5f52;}
  .home-screen .btn-dark{background:#f0ebe3;color:#6b5f52;border-color:#d5cdc0;}
  .home-screen .hint{color:#9a8e7e;}
  .home-screen .faint{color:#a99a88;}
  .home-screen .divider{background:linear-gradient(90deg,transparent,#e0d5c5,transparent);}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:18px 0;}
  .spread{display:flex;justify-content:space-between;align-items:center;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;}
  .topbar .code{font-family:var(--serif);letter-spacing:.3em;color:var(--gold);font-size:15px;}
  .muted{color:var(--dim);} .faint{color:var(--faint);}
  .grow{flex:1} .center{text-align:center}
  .stack>*+*{margin-top:12px}
  .mt{margin-top:16px} .mt8{margin-top:8px} .mb{margin-bottom:16px}
  /* script list */
  .scriptcard{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:18px 16px;
    background:linear-gradient(160deg,var(--ink2),var(--ink));cursor:pointer;transition:border-color .2s,transform .12s;}
  .scriptcard:active{transform:scale(.99)} .scriptcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .scriptcard .motif{position:absolute;right:-6px;top:-10px;font-size:74px;opacity:.10;filter:grayscale(.2);}
  .badge{font-size:10.5px;padding:3px 8px;border-radius:6px;letter-spacing:.06em;}
  .b-easy{background:#2c3a26;color:#a9d08a} .b-mid{background:#3a3322;color:#e0c068} .b-hard{background:#3a2422;color:#e3998a}
  /* dossier paper */
  .seal-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:30px 10px;}
  .seal{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#c4463a,#7e271f);
    display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:0 10px 30px -10px #000,inset 0 2px 10px rgba(255,255,255,.18);
    animation:seal .5s ease;border:2px solid #5e1c16;}
  .paper{background:
      radial-gradient(140% 120% at 100% 0,rgba(0,0,0,.05),transparent 60%),
      linear-gradient(180deg,#efe4cd,var(--paper));
    color:var(--paperink);border-radius:14px;padding:20px 18px;border:1px solid var(--paperline);
    box-shadow:0 12px 30px -16px #000;line-height:1.85;font-size:15px;}
  .paper h2{color:#3a2c18;font-size:24px;letter-spacing:.06em;}
  .paper .sec{margin-top:16px;}
  .paper .sechd{font-family:var(--serif);font-size:13px;letter-spacing:.22em;color:#8a6d3a;
    border-bottom:1px dashed var(--paperline);padding-bottom:5px;margin-bottom:8px;}
  .paper.killer{background:linear-gradient(180deg,#efe0d6,#e7cfc4);border-color:#cda192;}
  .paper.killer .sechd{color:#9c4a36;border-color:#cda192;}
  .stamp{display:inline-block;margin-top:14px;color:#a23a31;border:2px solid #a23a31;border-radius:8px;
    padding:4px 12px;font-family:var(--serif);letter-spacing:.3em;transform:rotate(-7deg);font-size:14px;opacity:.85;}
  /* players */
  .seat{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:var(--ink2);}
  .ava{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--ink3);flex-shrink:0;border:1px solid var(--line);}
  .dot{width:8px;height:8px;border-radius:50%;background:#4e7d3f;box-shadow:0 0 8px #4e7d3f;flex-shrink:0;}
  .dot.off{background:#5a4f44;box-shadow:none}
  /* chat */
  .chatwrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:4px 2px 10px;}
  .msg{max-width:86%;padding:9px 12px;border-radius:13px;font-size:14.5px;line-height:1.55;word-break:break-word;}
  .msg.me{align-self:flex-end;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a140c;border-bottom-right-radius:4px;}
  .msg.other{align-self:flex-start;background:var(--ink3);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg.dm{align-self:stretch;max-width:100%;background:linear-gradient(180deg,#241a14,#1d1510);border:1px solid var(--blood);color:#f0e2cf;
    font-family:var(--serif);line-height:1.85;font-size:15px;}
  .msg.sys{align-self:center;background:transparent;color:var(--faint);font-size:12px;letter-spacing:.05em;}
  .msg .who{font-size:11px;opacity:.7;margin-bottom:3px;}
  .msg.dm .who{color:var(--blood2);letter-spacing:.2em;}
  .cluecard{background:linear-gradient(180deg,var(--ink2),var(--ink));border:1px solid var(--gold2);border-left:3px solid var(--gold);
    border-radius:12px;padding:13px 14px;}
  .cluecard .ct{font-family:var(--serif);color:var(--gold);letter-spacing:.1em;font-size:14px;margin-bottom:5px;}
  .inputbar{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line);}
  .seg{display:flex;background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--dim);font-size:13px;padding:8px;border-radius:8px;font-family:var(--sans);}
  .seg button.on{background:var(--ink3);color:var(--gold);}
  .votecard{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--ink2);cursor:pointer;}
  .votecard.sel{border-color:var(--blood2);box-shadow:0 0 0 1px var(--blood2) inset;background:#241715;}
  .tag{font-size:10px;letter-spacing:.1em;color:var(--faint);}
  .float-note{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink3);border:1px solid var(--line);
    color:var(--txt);padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:0 10px 30px -10px #000;animation:fade .25s;}
  .overlay{position:fixed;inset:0;background:rgba(8,6,4,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:80;}
  .sheet{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:430px;width:100%;}
  a{color:var(--gold)}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .kbd{font-family:var(--serif);background:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--gold);}
</style>
</head>

    roles:[
      { id:"su", name:"苏晚晴", emoji:"👩‍🎨", gender:"女",

      { id:"chen", name:"陈野", emoji:"🧑‍🎨", gender:"男",

const $=(s,el=document)=>el.querySelector(s);
const app=$("#app");
const rand=(n)=>Math.random().toString(36).slice(2,2+n);
const esc=(s)=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl2br=(s)=>esc(s).replace(/\n/g,"<br>");

// 本地身份（持久化在本机，不同手机各自独立）
let ME = JSON.parse(localStorage.getItem("juben_me")||"null");

let db=null, fbOK=false;
try{
  if(CONFIG.firebase && CONFIG.firebase.apiKey && CONFIG.firebase.apiKey!=="PASTE_API_KEY"){
    firebase.initializeApp(CONFIG.firebase);

  }
}catch(e){ console.error(e); fbOK=false; }

const S={ view:"home", roomCode:null, room:null, ref:null, selScript:null, note:null, chatTab:"table" };
let unsub=null;

function go(v){ S.view=v; render(); }
function toast(msg,ms=2200){ S.note=msg; render(); clearTimeout(toast._t); toast._t=setTimeout(()=>{S.note=null;render();},ms); }
const myScript=()=>SCRIPTS.find(s=>s.id===(S.room&&S.room.meta&&S.room.meta.scriptId));
const myPlayer=()=>S.room&&S.room.players?S.room.players[ME.id]:null;
const myRole=()=>{ const sc=myScript(),p=myPlayer(); if(!sc||!p||!p.roleId)return null; return sc.roles.find(r=>r.id===p.roleId); };
const isHost=()=>S.room&&S.room.meta&&S.room.meta.hostId===ME.id;
const playerList=()=>{ const ps=(S.room&&S.room.players)?Object.values(S.room.players):[]; return ps.sort((a,b)=>(a.seat||0)-(b.seat||0)); };

/* ---------- Firebase 房间 ---------- */
function bindRoom(code){
  if(unsub&&S.ref){ S.ref.off("value",unsub); }
  S.roomCode=code; S.ref=db.ref("rooms/"+code);
  unsub=S.ref.on("value",snap=>{
    S.room=snap.val();
    if(!S.room){ toast("房间已不存在"); S.view="home"; S.roomCode=null; render(); return; }
    routeByPhase();
    render();
  });
}
function routeByPhase(){
  const ph=S.room.meta?S.room.meta.phase:"lobby";
  const map={lobby:"lobby",reading:"reading",intro:"intro",investigate:"investigate",vote:"vote",reveal:"reveal"};
  if(["lobby","reading","intro","investigate","vote","reveal"].includes(ph)) S.view=map[ph];
}
async function createRoom(){
  if(!fbOK)return toast("还没填 Firebase 配置（看文件顶部 CONFIG）");
  if(!ME.name.trim())return toast("先输入你的昵称");
  const code=(rand(4)).toUpperCase().replace(/[^A-Z0-9]/g,"X").slice(0,4).padEnd(4,"Q");
  const room={ meta:{ hostId:ME.id, phase:"lobby", round:0, scriptId:null, createdAt:Date.now() },
    players:{ [ME.id]:{ id:ME.id, name:ME.name.trim(), seat:1, ready:false, online:true, roleId:null } } };
  await db.ref("rooms/"+code).set(room);
  bindRoom(code);
}
async function joinRoom(code){
  if(!fbOK)return toast("还没填 Firebase 配置（看文件顶部 CONFIG）");
  if(!ME.name.trim())return toast("先输入你的昵称");
  code=code.toUpperCase().trim();
  const snap=await db.ref("rooms/"+code).once("value");
  if(!snap.exists())return toast("没找到这个房间");
  const room=snap.val(); const players=room.players||{};
  if(!players[ME.id]){
    if(Object.keys(players).length>=4 && room.meta.phase==="lobby")return toast("房间满了（4 人）");
    if(room.meta.phase!=="lobby" && !players[ME.id])return toast("游戏已经开始了");
    const seat=Object.keys(players).length+1;
    await db.ref(`rooms/${code}/players/${ME.id}`).set({ id:ME.id, name:ME.name.trim(), seat, ready:false, online:true, roleId:null });
  }else{
    await db.ref(`rooms/${code}/players/${ME.id}/online`).set(true);
  }
  bindRoom(code);
}
function leaveRoom(){
  if(S.ref&&S.room){ db.ref(`rooms/${S.roomCode}/players/${ME.id}/online`).set(false); S.ref.off("value",unsub); }
  S.room=null;S.roomCode=null;S.ref=null;S.view="home";render();
}
const upd=(path,val)=>db.ref(`rooms/${S.roomCode}/${path}`).set(val);
const setReady=(b)=>upd(`players/${ME.id}/ready`,b);

async function startGame(){
  const sc=myScript(); if(!sc)return toast("先选一个剧本");
  const ps=playerList(); if(ps.length<4)return toast("需要 4 人到齐才能开始");
  // 随机把角色分给四位玩家（真凶身份每局随机落到不同人头上）
  const roleIds=sc.roles.map(r=>r.id);
  for(let i=roleIds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[roleIds[i],roleIds[j]]=[roleIds[j],roleIds[i]];}
  const updates={};
  ps.forEach((p,i)=>{ updates[`players/${p.id}/roleId`]=roleIds[i]; updates[`players/${p.id}/ready`]=false; });
  updates["meta/phase"]="reading"; updates["meta/round"]=0;
  await db.ref("rooms/"+S.roomCode).update(updates);
  // 开场旁白
  postDM(sc.dmOpening,"opening");
}
const setPhase=(ph,round)=>{ const u={"meta/phase":ph}; if(round!=null)u["meta/round"]=round; db.ref("rooms/"+S.roomCode).update(u); };
function allReady(){ const ps=playerList(); return ps.length>=4 && ps.every(p=>p.ready); }
function resetGame(){
  const u={"meta/phase":"lobby","meta/round":0,"game":null,"chat":null,"dm":null,"votes":null};
  playerList().forEach(p=>{u[`players/${p.id}/roleId`]=null;u[`players/${p.id}/ready`]=false;});
  db.ref("rooms/"+S.roomCode).update(u);
}

/* ---------- 聊天 / 搜证 / DM ---------- */
function sendChat(text,channel){
  text=text.trim(); if(!text)return;
  const id="m_"+Date.now()+rand(3);
  db.ref(`rooms/${S.roomCode}/chat/${id}`).set({ id, ch:channel, sender:ME.id, name:myRoleName(), text, ts:Date.now() });
}
const myRoleName=()=>{ const r=myRole(); return r?`${r.name}`:(myPlayer()?myPlayer().name:ME.name); };
function revealClue(roundIdx){
  const sc=myScript(); const set=sc.clues[roundIdx]||[];
  const id="c_"+Date.now();
  db.ref(`rooms/${S.roomCode}/chat/${id}`).set({ id, ch:"table", sender:"system", kind:"clue", round:roundIdx+1, clues:set, ts:Date.now() });
}
function postDM(text,kind){
  const id="d_"+Date.now()+rand(3);
  db.ref(`rooms/${S.roomCode}/dm/${id}`).set({ id, role:"dm", text, kind:kind||"reply", ts:Date.now() });
}
function dmHistoryText(){
  const dm=S.room.dm?Object.values(S.room.dm).sort((a,b)=>a.ts-b.ts):[];
  return dm.map(m=>(m.role==="dm"?"DM：":"玩家：")+m.text).slice(-8).join("\n");
}
async function askDM(question){
  question=question.trim(); if(!question)return;
  const sc=myScript(); const phase=S.room.meta.phase;
  const id="q_"+Date.now()+rand(3);
  await db.ref(`rooms/${S.roomCode}/dm/${id}`).set({ id, role:"user", name:myRoleName(), text:question, ts:Date.now() });
  const revealed=collectRevealedClues();
  if(!CONFIG.dmEndpoint){ // 离线降级
    postDM(offlineDM(question,sc,revealed)); return;
  }
  S.dmThinking=true; render();
  try{
    const sys = dmSystemPrompt(sc,phase,revealed,false);
    const res=await fetch(CONFIG.dmEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ model:CONFIG.dmModel, temperature:0.85, max_tokens:600,
        messages:[{role:"system",content:sys},{role:"user",content:`【最近对话】\n${dmHistoryText()}\n\n【本轮玩家提问】${question}`}] })});
    const data=await res.json();
    const text=(data&&data.text)?data.text.trim():"（DM 沉默了片刻……线索都在卷宗里，再想想。）";
    postDM(text);
  }catch(e){ postDM("（与 DM 的通讯中断了。先用桌面线索推理吧——"+offlineDM(question,sc,collectRevealedClues())+"）"); }
  S.dmThinking=false; render();
}
function collectRevealedClues(){
  const chat=S.room.chat?Object.values(S.room.chat):[];
  const out=[]; chat.filter(m=>m.kind==="clue").forEach(c=>(c.clues||[]).forEach(x=>out.push(`${x.t}：${x.x}`)));
  return out;
}
function offlineDM(q,sc,revealed){
  const lines=[
    "线索就摆在桌上，注意那些对不上的细节——动机、时机、手段，三者俱全的人才是凶手。",
    "别被最显眼的动机牵着走，真凶往往最不起眼。再核对一遍每个人的不在场证明。",
    "问问自己：谁有手段？谁有时机？谁在说谎？把三个圈叠在一起，重合处就是答案。",
    "把已揭示的线索连成一条时间线，矛盾之处就是破绽所在。"
  ];
  return lines[Math.floor(Math.random()*lines.length)];
}
function dmSystemPrompt(sc,phase,revealed,fullReveal){
  const roleBriefs=sc.roles.map(r=>`- ${r.name}（${r.publicId}）｜秘密：${r.secret}｜${r.killer?"【真凶】":"非凶手"}`).join("\n");
  let base=`你是一场线下剧本杀《${sc.title}》的主持人(DM)，沉浸、克制、有戏剧感，用第二人称引导玩家，语言简洁(2-4句)，富画面感。\n\n【案情背景】${sc.intro}\n\n【全部真相（仅你知道，严禁泄露）】\n真凶：${sc.roles.find(r=>r.killer).name}。手法：${sc.solution.method}。动机：${sc.solution.motive}。\n角色档案：\n${roleBriefs}\n\n【已向全场揭示的线索】\n${revealed.join("\n")||"（暂无）"}`;
  if(fullReveal){
    base+=`\n\n【当前阶段：复盘】现在可以公开全部真相。请用一段有感染力的旁白揭晓真凶与手法，再逐一点出每个角色各自隐藏的秘密，最后给本局玩家一句简短点评。`;
  }else{
    base+=`\n\n【铁律】当前是推理过程中。绝对不能直接说出谁是凶手，不能泄露任何角色尚未暴露的秘密。可以渲染气氛、回应搜证、给“分级提示”（越问越具体但点到为止），把玩家往证据和矛盾上引。若玩家想直接套答案，就用反问把球踢回去。`;
  }
  return base;
}
async function dmFinale(){
  const sc=myScript();
  if(!CONFIG.dmEndpoint){ postDM(sc.solution.truth,"finale"); return; }
  S.dmThinking=true; render();
  try{
    const sys=dmSystemPrompt(sc,"reveal",collectRevealedClues(),true);
    const votes=S.room.votes||{}; const tally=Object.entries(votes).map(([pid,tid])=>{
      const v=(S.room.players[pid]||{}).name; const t=sc.roles.find(r=>r.id===tid); return `${v} 指认了 ${t?t.name:"弃票"}`;}).join("；");
    const res=await fetch(CONFIG.dmEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ model:CONFIG.dmModel, temperature:0.9, max_tokens:900,
        messages:[{role:"system",content:sys},{role:"user",content:`玩家的指认情况：${tally||"无"}。请揭晓真相并复盘点评。`}] })});
    const data=await res.json();
    postDM((data&&data.text)?data.text.trim():sc.solution.truth,"finale");
  }catch(e){ postDM(sc.solution.truth,"finale"); }
  S.dmThinking=false; render();
}

}

      <h3>① Firebase（实时联机，免费）</h3>
      <div class="hint">
        1. 打开 <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a>，新建项目。<br>
        2. 左侧「构建 → Realtime Database」，创建数据库，规则先选「测试模式」（30 天，宿舍玩够用）。<br>
        3. 项目设置 →「你的应用」→ 选网页应用 </>，复制那段 <span class="kbd">firebaseConfig</span>。<br>
        4. 粘到本文件顶部 <span class="kbd">CONFIG.firebase</span> 里（含 databaseURL）。
      </div>
      <div class="divider"></div>
      <h3>② AI DM（Cloudflare Worker，免费）</h3>
      <div class="hint">
        1. 注册 <a href="https://dash.cloudflare.com" target="_blank">dash.cloudflare.com</a> →「Workers & Pages」→ 新建 Worker。<br>
        2. 把随附的 <span class="kbd">worker.js</span> 整段粘进去，部署。<br>
        3. Worker 设置 → 变量与机密 → 加一个机密 <span class="kbd">DEEPSEEK_KEY</span> = 你的 DeepSeek key。<br>
        4. 把 Worker 网址填到 <span class="kbd">CONFIG.dmEndpoint</span>。不填也能玩，只是 DM 用内置旁白。
      </div>
      <div class="divider"></div>
      <h3>③ 放上线</h3>
      <div class="hint">把 <span class="kbd">index.html</span> 传到任意免费托管（Firebase Hosting / Vercel / GitHub Pages），四台手机开同一个网址即可。</div>
    </div>
    <div class="mt"><button class="btn btn-gold" id="back2">明白了</button></div>
  </div>`;
}

function topbar(){
  return `<div class="topbar">
    <button class="btn btn-dark btn-sm" id="leave">退出</button>
    <div class="code">房间 ${esc(S.roomCode)}</div>
    <span class="pill">${esc(myScript()?myScript().diffLabel:"未选本")}</span>
  </div>`;
}

function viewLobby(){
  const ps=playerList(); const host=isHost(); const sc=myScript();
  const seats=[1,2,3,4].map(i=>{
    const p=ps.find(x=>x.seat===i)||null;
    return `<div class="seat">
      <div class="ava">${p?esc(p.name.slice(0,1)):"·"}</div>
      <div class="grow"><div style="font-weight:600">${p?esc(p.name):"<span class='faint'>空座</span>"}</div>
      <div class="tag">${p?(p.id===S.room.meta.hostId?"房主":"玩家"):"等待加入"}</div></div>
      ${p?`<div class="dot ${p.online?"":"off"}"></div>${p.ready?'<span class="pill" style="color:#a9d08a;border-color:#3a5a2c">已就位</span>':'<span class="pill">未就位</span>'}`:""}
    </div>`;
  }).join("");

  const scripts=SCRIPTS.map(s=>{
    const sel=sc&&sc.id===s.id;
    const bcls=s.diff==="easy"?"b-easy":s.diff==="mid"?"b-mid":"b-hard";
    return `<div class="scriptcard ${sel?"sel":""}" data-script="${s.id}" ${host?"":"style='opacity:.7;pointer-events:none'"}>
      <div class="motif">${s.motif}</div>
      <div class="spread" style="margin-bottom:7px"><h3 style="font-size:21px">${esc(s.title)}</h3><span class="badge ${bcls}">${s.diffLabel}</span></div>
      <div class="hint" style="margin-bottom:9px">${esc(s.tagline)}</div>
      <div class="row" style="gap:7px"><span class="pill">${esc(s.genre)}</span><span class="pill">${s.players}人</span><span class="pill">${esc(s.duration)}</span></div>
    </div>`;
  }).join("");

  const me=myPlayer();
  return `${topbar()}<div class="scr scroll" style="padding-top:8px">
    <div class="spread mb"><h2>等待大厅</h2><span class="hint">${ps.length}/4 人</span></div>
    <div class="stack">${seats}</div>
    <div class="divider"></div>
    <div class="lbl">${host?"选择今晚的剧本（仅房主可选）":"房主正在选本"}</div>
    <div class="stack">${scripts}</div>
    <div class="divider"></div>
    <div class="stack">
      <button class="btn ${me&&me.ready?"btn-dark":"btn-ghost"}" id="ready">${me&&me.ready?"取消就位":"我已就位"}</button>
      ${host?`<button class="btn btn-gold" id="start" ${(!sc||ps.length<4||!allReady())?"disabled":""}>
        ${ps.length<4?"等待 4 人到齐":!sc?"请先选本":!allReady()?"等所有人就位":"开始 · 发放角色"}</button>`:
        `<div class="center hint">${allReady()&&sc?"等房主开始…":"就位后等待开局"}</div>`}
    </div>
    <div class="center faint" style="font-size:11px;margin-top:14px">把房间码 <b style="color:var(--gold);letter-spacing:.2em">${esc(S.roomCode)}</b> 发到宿舍群，让室友加入</div>
  </div>`;
}

function viewReading(){
  const sc=myScript(),role=myRole(),p=myPlayer();
  if(!role) return `${topbar()}<div class="scr center"><div class="grow"></div><h2>正在发放角色…</h2><div class="grow"></div></div>`;
  if(!S.opened){
    return `${topbar()}<div class="scr seal-wrap">
      <div class="brand">你的私密卷宗</div>
      <h2 style="font-size:30px">${esc(role.name)}</h2>
      <div class="hint center" style="max-width:280px">这是只属于你的身份。点开火漆封印阅读，<b style="color:var(--gold)">别让旁人看你的屏幕</b>。</div>
      <div class="seal" id="openseal">${role.emoji}</div>
      <div class="faint" style="font-size:12px">轻点封印 · 揭开身份</div>
    </div>`;
  }
  const k=role.killer;
  return `${topbar()}<div class="scr scroll">
    <div class="paper ${k?"killer":""}">
      <div class="spread"><h2>${esc(role.name)}</h2><span style="font-size:30px">${role.emoji}</span></div>
      <div class="faint" style="color:#8a6d3a;font-size:12.5px">${esc(role.gender)} · ${esc(role.publicId)}</div>
      <div class="sec"><div class="sechd">人物小传</div>${nl2br(role.bio)}</div>
      <div class="sec"><div class="sechd">${k?"你的秘密（绝密）":"你藏着的秘密"}</div>${nl2br(role.secret)}</div>
      <div class="sec"><div class="sechd">你的目标</div>${nl2br(role.objective)}</div>
      <div class="sec"><div class="sechd">当晚行动线</div>${nl2br(role.timeline)}</div>
      ${k?'<div class="stamp">真　凶</div>':'<div class="stamp" style="color:#5a7a3a;border-color:#5a7a3a">清　白</div>'}
    </div>
    <div class="mt stack">
      ${p.ready?`<div class="center hint">已合上卷宗，等其他人读完…（${playerList().filter(x=>x.ready).length}/4）</div>`:
        `<button class="btn btn-gold" id="doneread">我已读完 · 合上卷宗</button>`}
      ${isHost()&&allReady()?`<button class="btn btn-blood" id="toIntro">全员就绪 · 进入自我介绍</button>`:""}
    </div>
    <div class="center faint" style="font-size:11px;margin-top:10px">读完后可随时点右上角“退出”再回来，身份不会变</div>
  </div>`;
}

function viewIntro(){
  const sc=myScript();
  const dm=S.room.dm?Object.values(S.room.dm).sort((a,b)=>a.ts-b.ts):[];
  const opening=dm.find(m=>m.kind==="opening");
  return `${topbar()}<div class="scr scroll">
    <h2 class="mb" style="color:var(--gold)">第一幕 · 自我介绍</h2>
    ${opening?`<div class="msg dm" style="max-width:100%"><div class="who">DM · 开场</div>${nl2br(opening.text)}</div>`:""}
    <div class="card mt stack">
      <div class="sechd" style="font-family:var(--serif);letter-spacing:.2em;color:var(--gold);font-size:13px">怎么玩这一幕</div>
      <div class="hint">轮流用<b style="color:var(--txt)">角色的身份</b>做自我介绍：你是谁、当晚在做什么。可以隐瞒，可以撒谎，但别露馅。说完这轮，就进入搜证。</div>
    </div>
    <div class="stack mt">
      ${playerList().map(p=>{const r=sc.roles.find(x=>x.id===p.roleId);return `<div class="seat"><div class="ava">${r?r.emoji:"·"}</div><div class="grow"><div style="font-weight:600">${r?esc(r.name):esc(p.name)}</div><div class="tag">${r?esc(r.publicId):""}</div></div></div>`;}).join("")}
    </div>
    <div class="mt">
      ${isHost()?`<button class="btn btn-gold" id="toInvestigate">所有人介绍完毕 · 开始搜证</button>`:`<div class="center hint">介绍完后，等房主开启搜证</div>`}
    </div>
  </div>`;
}

function viewInvestigate(){
  const sc=myScript(); const round=S.room.meta.round||1; const host=isHost();
  const chat=S.room.chat?Object.values(S.room.chat).sort((a,b)=>a.ts-b.ts):[];
  const dm=S.room.dm?Object.values(S.room.dm).filter(m=>m.kind!=="opening").sort((a,b)=>a.ts-b.ts):[];
  const onDM=S.chatTab==="dm";

  let stream="";
  if(onDM){
    stream=dm.map(m=>m.role==="dm"
      ?`<div class="msg dm"><div class="who">D　M</div>${nl2br(m.text)}</div>`
      :`<div class="msg other"><div class="who">${esc(m.name)}（问 DM）</div>${nl2br(m.text)}</div>`).join("");
    if(S.dmThinking) stream+=`<div class="msg dm"><div class="who">D　M</div>……（推演中）</div>`;
    if(!dm.length&&!S.dmThinking) stream=`<div class="msg sys">向 DM 提问搜证，例如：“我想查死者的电脑”“底座上有指纹吗？”</div>`;
  }else{
    stream=chat.map(m=>{
      if(m.kind==="clue"){
        return `<div class="cluecard" style="margin:2px 0">
          <div class="ct">🔎 第 ${m.round} 轮线索揭示</div>
          ${(m.clues||[]).map(c=>`<div style="margin-top:7px"><b style="color:var(--gold)">${esc(c.t)}</b><div class="hint" style="color:var(--dim);margin-top:2px">${esc(c.x)}</div></div>`).join("")}
        </div>`;
      }
      if(m.sender==="system") return `<div class="msg sys">${nl2br(m.text)}</div>`;
      const mine=m.sender===ME.id;
      return `<div class="msg ${mine?"me":"other"}">${mine?"":`<div class="who">${esc(m.name)}</div>`}${nl2br(m.text)}</div>`;
    }).join("");
    if(!chat.length) stream=`<div class="msg sys">圆桌已就坐。用角色身份发言、对质、推理。房主可逐轮揭示线索。</div>`;
  }

  const revealedRounds=chat.filter(m=>m.kind==="clue").map(m=>m.round);
  return `${topbar()}
  <div style="padding:0 18px"><div class="seg mb">
    <button data-tab="table" class="${onDM?"":"on"}">🗣 圆桌讨论</button>
    <button data-tab="dm" class="${onDM?"on":""}">🎙 问 DM 搜证</button>
  </div></div>
  <div class="scr" style="padding-top:0;flex:1;min-height:0">
    <div class="chatwrap">${stream}</div>
    ${host?`<div class="row" style="gap:7px;margin:6px 0">
      ${[0,1,2].map(i=>`<button class="btn btn-dark btn-sm" data-clue="${i}" style="flex:1;${revealedRounds.includes(i+1)?"opacity:.45":""}">${revealedRounds.includes(i+1)?"✓ ":""}揭示第${i+1}轮</button>`).join("")}
    </div>
    <button class="btn btn-blood btn-sm" id="toVote" style="width:100%;margin-bottom:6px">线索揭完 · 进入指认投票</button>`:""}
    <div class="inputbar">
      <input id="say" placeholder="${onDM?"问 DM 一个搜证问题…":"以角色身份发言…"}" />
      <button class="btn ${onDM?"btn-blood":"btn-gold"} btn-sm" id="send" style="flex:0 0 auto;padding:12px 18px">${onDM?"问":"说"}</button>
    </div>
  </div>`;
}

function viewVote(){
  const sc=myScript(); const me=myPlayer(); const votes=S.room.votes||{};
  const myVote=votes[ME.id]; const voted=ME.id in votes;
  const cards=playerList().map(p=>{
    const r=sc.roles.find(x=>x.id===p.roleId);
    const sel=myVote===p.roleId;
    return `<div class="votecard ${sel?"sel":""}" data-vote="${p.roleId}">
      <div class="ava">${r?r.emoji:"·"}</div>
      <div class="grow"><div style="font-weight:600">${r?esc(r.name):esc(p.name)}</div><div class="tag">${r?esc(r.publicId):""}</div></div>
      ${sel?'<span class="pill" style="color:var(--blood2);border-color:var(--blood)">指认</span>':""}
    </div>`;
  }).join("");
  const count=Object.keys(votes).length;
  return `${topbar()}<div class="scr scroll">
    <h2 style="color:var(--blood2)">最后指认</h2>
    <div class="hint mb">谁是凶手？想清楚动机、时机、手段——选定后无法更改。已投 ${count}/4。</div>
    <div class="stack">${cards}</div>
    <div class="mt">
      ${voted?`<div class="center hint">你已指认。等待其他人…（${count}/4）</div>`:`<div class="center faint" style="font-size:12px">点选一名嫌疑人即提交</div>`}
      ${isHost()?`<button class="btn btn-blood mt8" id="toReveal" ${count<1?"disabled":""}>揭晓真相</button>`:""}
    </div>
  </div>`;
}

function viewReveal(){
  const sc=myScript(); const votes=S.room.votes||{}; const killer=sc.roles.find(r=>r.killer);
  const dm=S.room.dm?Object.values(S.room.dm).sort((a,b)=>a.ts-b.ts):[];
  const finale=dm.find(m=>m.kind==="finale");
  // 票数
  const tally={}; Object.values(votes).forEach(rid=>tally[rid]=(tally[rid]||0)+1);
  const right=Object.entries(votes).filter(([pid,rid])=>rid===killer.id).map(([pid])=>(S.room.players[pid]||{}).name);

  const voteRows=playerList().map(p=>{
    const r=sc.roles.find(x=>x.id===p.roleId);
    const myV=votes[p.id]; const vR=myV?sc.roles.find(x=>x.id===myV):null;
    const ok=myV===killer.id;
    return `<div class="seat"><div class="ava">${r?r.emoji:"·"}</div>
      <div class="grow"><div style="font-weight:600">${esc(p.name)} <span class="faint">饰 ${r?esc(r.name):"?"}</span></div>
      <div class="tag">指认了 ${vR?esc(vR.name):"（弃票）"} ${ok?'<span style="color:#a9d08a">✓ 命中</span>':'<span style="color:var(--blood2)">✗</span>'}</div></div></div>`;
  }).join("");

  return `${topbar()}<div class="scr scroll">
    <div class="center" style="margin:6px 0 12px">
      <div class="brand" style="color:var(--blood2)">THE TRUTH</div>
      <h2 style="font-size:30px;margin-top:4px">真凶是 · ${esc(killer.name)}</h2>
      <div class="hint mt8">${esc(sc.solution.method)}</div>
    </div>

    <div class="card stack mb" style="border-color:var(--blood)">
      <div class="sechd" style="font-family:var(--serif);letter-spacing:.2em;color:var(--blood2);font-size:13px">DM 复盘</div>
      ${finale?`<div style="font-family:var(--serif);line-height:1.85">${nl2br(finale.text)}</div>`:
        `<div class="hint">${S.dmThinking?"DM 正在揭晓……":"点下方按钮让 DM 揭晓真相与复盘"}</div>
         ${isHost()?`<button class="btn btn-blood btn-sm mt8" id="finale" ${S.dmThinking?"disabled":""}>让 DM 揭晓复盘</button>`:""}`}
    </div>

    <div class="lbl">各自的秘密</div>
    <div class="stack mb">
      ${sc.roles.map(r=>`<div class="seat" style="${r.killer?"border-color:var(--blood)":""}"><div class="ava">${r.emoji}</div>
        <div class="grow"><div style="font-weight:600">${esc(r.name)}</div><div class="hint" style="color:var(--dim);margin-top:2px">${esc(sc.solution.reveals[r.id])}</div></div></div>`).join("")}
    </div>

    <div class="lbl">指认结果</div>
    <div class="stack">${voteRows}</div>
    <div class="card mt center">
      ${right.length?`🎉 猜中的侦探：<b style="color:var(--gold)">${right.map(esc).join("、")}</b>`:`本局无人识破真凶——凶手赢了。`}
    </div>

    <div class="mt stack">
      ${isHost()?`<button class="btn btn-gold" id="again">再来一局（回大厅换本）</button>`:`<div class="center hint">等房主开下一局</div>`}
    </div>
  </div>`;
}

/* =================================================================
   ⑤ 事件绑定
   ================================================================= */
function bindEvents(){
  const on=(sel,ev,fn)=>{const el=$(sel);if(el)el.addEventListener(ev,fn);};
  const nick=$("#nick"); if(nick) nick.addEventListener("input",e=>{ME.name=e.target.value;saveMe();});

  on("#create","click",createRoom);
  on("#join","click",()=>{const c=$("#code");joinRoom(c?c.value:"");});
  on("#howto","click",()=>go("howto"));
  on("#back","click",()=>go("home")); on("#back2","click",()=>go("home"));
  on("#leave","click",leaveRoom);

  // lobby
  document.querySelectorAll("[data-script]").forEach(el=>el.addEventListener("click",()=>{
    if(!isHost())return; upd("meta/scriptId",el.getAttribute("data-script"));
  }));
  on("#ready","click",()=>setReady(!(myPlayer()&&myPlayer().ready)));
  on("#start","click",startGame);

  // reading
  on("#openseal","click",()=>{S.opened=true;render();});
  on("#doneread","click",()=>setReady(true));
  on("#toIntro","click",()=>setPhase("intro"));

  // intro
  on("#toInvestigate","click",()=>setPhase("investigate",1));

  // investigate
  document.querySelectorAll("[data-tab]").forEach(el=>el.addEventListener("click",()=>{S.chatTab=el.getAttribute("data-tab");render();}));
  document.querySelectorAll("[data-clue]").forEach(el=>el.addEventListener("click",()=>{
    const i=+el.getAttribute("data-clue");
    const done=collectRevealedClues();
    revealClue(i); upd("meta/round",i+1);
  }));
  const say=$("#say");
  const doSay=()=>{ const v=say.value; if(!v.trim())return; if(S.chatTab==="dm"){askDM(v);}else{sendChat(v,"table");} say.value=""; };
  on("#send","click",doSay);
  if(say) say.addEventListener("keydown",e=>{if(e.key==="Enter")doSay();});
  on("#toVote","click",()=>setPhase("vote"));

  // vote
  document.querySelectorAll("[data-vote]").forEach(el=>el.addEventListener("click",()=>{
    if(ME.id in (S.room.votes||{}))return toast("你已经指认过了");
    upd(`votes/${ME.id}`,el.getAttribute("data-vote"));
  }));
  on("#toReveal","click",()=>setPhase("reveal"));

  // reveal
  on("#finale","click",dmFinale);
  on("#again","click",()=>{S.opened=false;resetGame();});
}

/* 自动重连上次房间 */
(function init(){
  render();
})();
</script>
</body>
</html>
